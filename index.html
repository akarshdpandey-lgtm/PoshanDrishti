<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoshanDrishti — Mother &amp; Child Screening Visit</title>
<meta name="description" content="One home visit, two linked screenings: a child's growth checked against WHO Child Growth Standards, and the mother's anaemia risk triage with referral for a measured haemoglobin test. Offline, on-device, for ASHA and Anganwadi workers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F2EC; --card:#FFFDF8; --ink:#2E241B; --ink2:#4A3E33; --muted:#7A6A5B;
    --line:#E4D7C3; --accent:#B4491F; --accent-deep:#8F3413; --accent-soft:#F7E8DC;
    --sage:#5F6F52; --sage-soft:#EBEFE3; --amber:#A8740F; --amber-soft:#F7EDD3;
    --orange:#BC5410; --orange-soft:#F9E7D2; --red:#A92F22; --red-soft:#F9E3DC;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.55}
  .wrap{max-width:740px;margin:0 auto;padding:22px 16px 60px}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;line-height:1.2;margin:0}
  a{color:var(--accent-deep)}
  .hidden{display:none !important}
  /* Header */
  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:6px 2px 2px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand svg{flex:none;margin-top:4px}
  .brand h1{font-size:32px;font-weight:700;letter-spacing:.2px}
  .brand h1 .acc{color:var(--accent)}
  .tagline{color:var(--ink2);font-size:15.5px;margin:8px 2px 0;max-width:58ch}
  .langtoggle{display:flex;border:1.5px solid var(--accent);border-radius:999px;overflow:hidden;flex:none;margin-top:6px}
  .langtoggle button{appearance:none;border:0;background:transparent;color:var(--accent-deep);font:600 14px 'Inter',sans-serif;padding:9px 14px;cursor:pointer;min-height:40px}
  .langtoggle button.on{background:var(--accent);color:#FFF7EE}
  .disc{background:var(--accent-soft);border:1px solid var(--line);color:var(--accent-deep);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;margin:14px 0 4px}
  /* Buttons */
  .btn{appearance:none;border:0;background:var(--accent);color:#FFF7EE;font:600 15.5px 'Inter',sans-serif;border-radius:12px;padding:14px 20px;cursor:pointer;min-height:50px;width:100%}
  .btn.alt{background:var(--sage)}
  .btn.ghost{background:transparent;color:var(--accent-deep);border:1.5px solid var(--accent);width:auto;padding:10px 16px;min-height:44px}
  .btn.small{width:auto;padding:10px 16px;min-height:44px;font-size:14.5px}
  .btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--red);width:auto;padding:10px 16px;min-height:44px}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
  .btnrow .btn{width:auto;flex:1}
  /* Cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 1px 2px rgba(46,36,27,.05)}
  .card h2{font-size:21px;font-weight:600;margin-bottom:4px}
  .card h3{font-size:18px;font-weight:600;margin-bottom:4px}
  .card .sub{color:var(--muted);font-size:14px;margin:0 0 12px}
  /* Forms */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  label.flabel{display:block;font-weight:600;font-size:14px;margin-bottom:6px;color:var(--ink2)}
  input[type=text],input[type=number],input[type=date],select{width:100%;padding:13px 12px;font-size:16px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-family:inherit;min-height:50px}
  .field{margin-bottom:12px}
  .hint{font-size:13px;color:var(--muted);margin-top:4px}
  /* Segmented control */
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg label{flex:1;min-width:96px}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg span{display:block;text-align:center;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 10px;font-weight:600;font-size:15px;cursor:pointer;min-height:48px}
  .seg input:checked + span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-deep)}
  .seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
  /* Chip checkboxes */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chipcheck input{position:absolute;opacity:0;pointer-events:none}
  .chipcheck span{display:inline-block;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 15px;font-weight:600;font-size:14.5px;cursor:pointer;min-height:44px}
  .chipcheck input:checked + span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-deep)}
  .chipcheck input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
  .checkgroup{margin:14px 0}
  .checkgroup .glabel{font-weight:600;font-size:14.5px;color:var(--ink2);margin-bottom:4px}
  .checkgroup .gsub{font-size:13.5px;color:var(--muted);margin:0 0 8px}
  /* Family list */
  .famrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
  .famrow .fi{flex:1;min-width:0}
  .famrow .fn{font-weight:700;font-size:16.5px}
  .famrow .fm{font-size:13.5px;color:var(--muted)}
  .famrow .chev{color:var(--accent);font-weight:700;font-size:20px}
  .empty{color:var(--muted);font-size:15px;padding:8px 2px}
  /* Results */
  .result{border-radius:16px;padding:18px;margin:16px 0;border:1.5px solid var(--line);background:var(--card)}
  .result .rk{font:700 12.5px 'Inter',sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
  .badge{display:inline-block;font:700 13px 'Inter',sans-serif;letter-spacing:.04em;padding:5px 12px;border-radius:999px;text-transform:uppercase}
  .b-sam{background:var(--red-soft);color:#6E1B10;border:1.5px solid #DDA293}
  .b-mam{background:var(--amber-soft);color:#5F4707;border:1.5px solid #DEC98F}
  .b-ok{background:var(--sage-soft);color:#37452C;border:1.5px solid #B9C4A6}
  .b-high{background:var(--red-soft);color:#6E1B10;border:1.5px solid #DDA293}
  .b-mod{background:var(--amber-soft);color:#5F4707;border:1.5px solid #DEC98F}
  .b-low{background:var(--sage-soft);color:#37452C;border:1.5px solid #B9C4A6}
  .b-info{background:var(--accent-soft);color:var(--accent-deep);border:1.5px solid var(--line)}
  .zrow{display:grid;grid-template-columns:118px 1fr 62px;gap:10px;align-items:center;margin:9px 0}
  .zrow .zk{font-size:13.5px;font-weight:600;color:var(--ink2)}
  .zrow .zv{font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:700;text-align:right}
  .zbar{position:relative;height:12px;border-radius:6px;background:#EFE7D8;overflow:hidden}
  .zbar .zone{position:absolute;top:0;bottom:0}
  .zbar .z-neg3{background:#EFC9BF;left:0}
  .zbar .z-neg2{background:#F3E3BC}
  .zbar .z-ok{background:#D8E0CB}
  .zbar .mark{position:absolute;top:-2px;bottom:-2px;width:4px;border-radius:2px;background:var(--ink)}
  .actionbox{border-radius:12px;padding:13px 15px;font-size:15px;margin-top:12px}
  .actionbox.red{background:var(--red-soft);color:#5C1D13}
  .actionbox.amber{background:var(--amber-soft);color:#5F4707}
  .actionbox.green{background:var(--sage-soft);color:#37452C}
  .actionbox p{margin:4px 0}
  .flags{background:var(--orange-soft);border:1.5px solid #E3B98C;color:#6E3405;border-radius:12px;padding:12px 14px;font-size:14.5px;margin-top:12px}
  .reasons{margin:8px 0 0;padding-left:20px}
  .reasons li{margin:4px 0;font-size:15px}
  .listenbtn{appearance:none;border:1.5px solid var(--accent);background:#fff;color:var(--accent-deep);border-radius:999px;padding:9px 15px;font:600 14px 'Inter',sans-serif;cursor:pointer;min-height:42px;margin-top:12px}
  .smalldisc{font-size:13px;color:var(--muted);margin-top:12px}
  .trendbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 10px 6px;margin-top:12px}
  .trendbox svg{width:100%;height:auto;display:block}
  .legend{display:flex;flex-wrap:wrap;gap:16px;padding:6px 8px 10px;font-size:13px;color:var(--ink2)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .swatch{width:22px;height:0;border-top:3px solid var(--accent);border-radius:2px;display:inline-block}
  .swatch.waz{border-color:var(--sage)}
  .histitem{border-top:1px solid var(--line);padding:10px 2px;font-size:14.5px}
  .histitem:first-child{border-top:0}
  .histitem .hd{font-weight:700}
  .histitem .hm{color:var(--muted);font-size:13.5px}
  footer{margin-top:26px;border-top:1px solid var(--line);padding-top:16px;font-size:13.5px;color:var(--muted)}
  footer p{margin:6px 0}
  details.how{margin:10px 0 2px}
  details.how summary{cursor:pointer;font-weight:600;color:var(--accent-deep);font-size:15px;padding:6px 0}
  details.how p,details.how li{font-size:14.5px;color:var(--ink2)}
  .refactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:stretch}
  .refactions .btn{flex:1}
  .refactions select{flex:1;min-width:180px}
  .duenow{color:var(--red);font-weight:700}
  .cascline{font-size:13px;color:var(--muted);margin-top:10px}
  .sibblock{border:1.5px dashed var(--line);border-radius:12px;padding:12px;margin:10px 0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="16" cy="13" r="7.5" fill="#B4491F"/><circle cx="27" cy="19" r="5.5" fill="#5F6F52"/><path d="M6 34c2-6 7-9 12-9 4 0 7 1.6 9.4 4.2" fill="none" stroke="#8F3413" stroke-width="2.6" stroke-linecap="round"/></svg>
      <h1>Poshan<span class="acc">Drishti</span></h1>
    </div>
    <div class="langtoggle" role="group" aria-label="Language">
      <button type="button" id="langEn" class="on">English</button>
      <button type="button" id="langHi">हिंदी</button>
    </div>
  </header>
  <p class="tagline" data-i18n="tagline"></p>
  <div class="disc" data-i18n="discTop"></div>

  <main id="view-home">
    <div class="btnrow"><button type="button" class="btn" id="btnNewVisit"></button></div>
    <h2 style="font-size:20px;margin:18px 0 4px" data-i18n="savedFamilies"></h2>
    <div id="famList"></div>
    <div id="openPanel"></div>
    <div class="card">
      <h3 data-i18n="aboutTitle"></h3>
      <p class="sub" data-i18n="aboutBody"></p>
      <details class="how">
        <summary data-i18n="howTitle"></summary>
        <div id="howBody"></div>
      </details>
      <p class="smalldisc" data-i18n="privacyNote"></p>
    </div>
  </main>

  <main id="view-visit" class="hidden">
    <div class="btnrow"><button type="button" class="btn ghost" data-back="home">← <span data-i18n="back"></span></button></div>
    <h2 style="font-size:22px" id="visitTitle"></h2>
    <form id="visitForm" novalidate>
      <div class="card" id="motherCard">
        <h3 data-i18n="motherTitle"></h3>
        <p class="sub" data-i18n="motherSub"></p>
        <div class="grid">
          <div class="field"><label class="flabel" for="mName" data-i18n="motherName"></label><input type="text" id="mName" autocomplete="off"></div>
          <div class="field"><label class="flabel" for="mAge" data-i18n="motherAge"></label><input type="number" id="mAge" min="12" max="60" step="1" inputmode="numeric"></div>
        </div>
        <div class="field">
          <label class="flabel" data-i18n="pregnantQ"></label>
          <div class="seg" id="pregSeg">
            <label><input type="radio" name="preg" value="no" checked><span data-i18n="pregNo"></span></label>
            <label><input type="radio" name="preg" value="t1"><span data-i18n="pregT1"></span></label>
            <label><input type="radio" name="preg" value="t2"><span data-i18n="pregT2"></span></label>
            <label><input type="radio" name="preg" value="t3"><span data-i18n="pregT3"></span></label>
          </div>
        </div>
        <div class="checkgroup">
          <div class="glabel" data-i18n="pallorTitle"></div>
          <p class="gsub" data-i18n="pallorSub"></p>
          <div class="chips" id="pallorChips"></div>
        </div>
        <div class="checkgroup">
          <div class="glabel" data-i18n="symptomsTitle"></div>
          <div class="chips" id="symptomChips"></div>
        </div>
        <div class="checkgroup">
          <div class="glabel" data-i18n="riskTitle"></div>
          <div class="chips" id="riskChips"></div>
        </div>
        <div class="field" style="margin-top:14px">
          <label class="flabel" for="mHb" data-i18n="hbLabel"></label>
          <input type="number" id="mHb" min="3" max="20" step="0.1" inputmode="decimal">
          <div class="hint" data-i18n="hbHint"></div>
        </div>
      </div>
      <div id="childBlocks"></div>
      <div class="btnrow"><button type="button" class="btn ghost" id="btnAddChild"></button></div>
      <div class="btnrow"><button type="submit" class="btn" id="btnSaveVisit"></button></div>
      <p class="smalldisc" id="formError" style="color:var(--red);font-weight:600"></p>
    </form>
  </main>

  <main id="view-results" class="hidden">
    <div class="btnrow"><button type="button" class="btn ghost" data-back="home">← <span data-i18n="back"></span></button></div>
    <h2 style="font-size:22px" data-i18n="resultsTitle"></h2>
    <div id="resultsWrap"></div>
    <div class="btnrow"><button type="button" class="btn alt" data-back="home" id="btnDone"></button></div>
  </main>

  <main id="view-family" class="hidden">
    <div class="btnrow"><button type="button" class="btn ghost" data-back="home">← <span data-i18n="back"></span></button></div>
    <h2 style="font-size:22px" id="famTitle"></h2>
    <div id="famDetail"></div>
    <div class="btnrow">
      <button type="button" class="btn" id="btnFamVisit"></button>
      <button type="button" class="btn danger" id="btnFamDelete"></button>
    </div>
  </main>

  <main id="view-cascade" class="hidden">
    <div id="cascadeWrap"></div>
  </main>

  <footer>
    <p data-i18n="footDisc"></p>
    <p data-i18n="footCredit"></p>
  </footer>
</div>

  tagline: "One home visit, two linked screenings — a child's growth checked against WHO standards, and the mother's anaemia risk assessed honestly, ending in referral for a real haemoglobin test.",

  aboutBody: "For ASHA and Anganwadi workers: in a single home visit it (1) computes the child's weight-for-age, height-for-age and weight-for-height against the WHO Child Growth Standards and classifies acute malnutrition (SAM / MAM) with a referral action, and (2) runs a structured anaemia-risk check for the mother — observed pallor, symptoms and risk factors — that ends in referral for a measured haemoglobin test. It works fully offline after the first load.",
  howTitle: "How the screening works — and its limits",
  howBody: "<p><b>Child:</b> z-scores use the WHO LMS method (the same published tables used by WHO Anthro), with the WHO adjustment for values beyond ±3. SAM = weight-for-height below −3, or MUAC below 115 mm, or swelling of both feet. MAM = weight-for-height −3 to below −2, or MUAC 115 to below 125 mm (MUAC only from 6 months). Unusual values are flagged for re-measurement.</p><p><b>Mother:</b> this is a risk triage, not a test. Pallor and checklists cannot measure haemoglobin — published studies show pallor alone misses many cases. The result is a referral decision, never a diagnosis. If a real measured Hb value exists, the app only classifies it using WHO 2024 cut-offs.</p><p><b>Trend:</b> past visits are shown as the child's own record. A prompt to visit sooner appears if weight has not risen or the z-score has fallen since the last visit. It is a follow-up prompt, not a forecast.</p><p><b>Household check:</b> when a child is SAM or MAM, the visit cannot be closed until a short household check is done or its deferral is recorded: the other under-5 children in the home are screened with the same rules, three TB-contact questions are asked, and a referral record is written for each person referred. At later contacts the worker confirms on this same phone whether the family actually reached the facility; if they did not, the reason (barrier) is recorded, follow-up is prompted at day 3, 7 and 14, and the referral closes only as Reached or after three recorded attempts. The app never hears back from the facility — closure is the worker's own confirmation, and nothing is sent anywhere.</p>",

  aboutBody: "ASHA और आँगनवाड़ी कार्यकर्ताओं के लिए: एक ही घर-भेंट में यह (1) बच्चे के वज़न-आयु, ऊँचाई-आयु और वज़न-ऊँचाई की गणना WHO बाल वृद्धि मानकों से करके तीव्र कुपोषण (SAM / MAM) का वर्गीकरण व रेफ़रल कार्रवाई देता है, और (2) माँ के लिए संरचित एनीमिया-जोखिम जाँच — पीलापन, लक्षण और जोखिम कारक — चलाता है, जो मापे गए हीमोग्लोबिन परीक्षण के रेफ़रल पर ख़त्म होती है। पहली बार खुलने के बाद यह पूरी तरह ऑफ़लाइन चलता है।",
  howTitle: "जाँच कैसे होती है — और इसकी सीमाएँ",
  howBody: "<p><b>बच्चा:</b> z-score WHO LMS विधि से निकलते हैं (वही प्रकाशित तालिकाएँ जो WHO Anthro उपयोग करता है), ±3 से बाहर के मानों पर WHO समायोजन सहित। SAM = वज़न-ऊँचाई −3 से नीचे, या MUAC 115 मिमी से नीचे, या दोनों पैरों में सूजन। MAM = वज़न-ऊँचाई −3 से −2 के बीच, या MUAC 115 से 125 मिमी के बीच (MUAC केवल 6 माह से)। असामान्य मानों पर दोबारा मापने का संकेत मिलता है।</p><p><b>माँ:</b> यह जोखिम-आकलन है, परीक्षण नहीं। पीलापन और सूची से हीमोग्लोबिन नहीं मापा जा सकता — प्रकाशित अध्ययनों में केवल पीलापन कई मामलों को छोड़ देता है। परिणाम केवल रेफ़रल का निर्णय है, निदान कभी नहीं। यदि असली मापा गया Hb मान मौजूद हो, तो ऐप उसे केवल WHO 2024 सीमाओं से वर्गीकृत करता है।</p><p><b>प्रवृत्ति:</b> पिछली भेंटें बच्चे के अपने रिकॉर्ड के रूप में दिखती हैं। यदि पिछली भेंट से वज़न न बढ़ा हो या z-score गिरा हो, तो जल्दी भेंट का संकेत आता है। यह अनुवर्ती संकेत है, भविष्यवाणी नहीं।</p><p><b>घर-जाँच:</b> जब किसी बच्चे को SAM या MAM मिलता है, तो भेंट तब तक बंद नहीं होती जब तक एक छोटी घर-जाँच पूरी न हो जाए या उसका स्थगन दर्ज न हो जाए: घर के अन्य 5 वर्ष से कम बच्चों की उन्हीं नियमों से जाँच होती है, टीबी-संपर्क के तीन प्रश्न पूछे जाते हैं, और रेफ़र किए गए हर व्यक्ति का रेफ़रल रिकॉर्ड लिखा जाता है। बाद की भेंटों में कार्यकर्ता इसी फ़ोन पर पुष्टि करती है कि परिवार सच में सुविधा तक पहुँचा या नहीं; यदि नहीं पहुँचा, तो कारण (रुकावट) दर्ज होता है, दिन 3, 7 और 14 पर अनुवर्ती का संकेत मिलता है, और रेफ़रल केवल पहुँचा के रूप में या तीन दर्ज प्रयासों के बाद ही बंद होता है। ऐप को सुविधा से कोई सूचना वापस नहीं मिलती — बंद होना कार्यकर्ता की अपनी पुष्टि है, और कुछ भी कहीं भेजा नहीं जाता।</p>",

    s += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + Y(zl) + '" y2="' + Y(zl) + '" stroke="#C9B99B" stroke-width="1" stroke-dasharray="4 3"/><text x="' + (W - padR - 16) + '" y="' + (Y(zl) - 3) + '" font-size="9" fill="#7A6A5B">' + zl + "</text>";
  });
  var series = [ { k: "waz", col: "#5F6F52" }, { k: "whz", col: "#B4491F" } ];
  series.forEach(function (sr) {
    var pts = [];
    vs.forEach(function (v, i) { if (v[sr.k] !== null && v[sr.k] !== undefined) pts.push([X(i), Y(v[sr.k])]); });

  });
  vs.forEach(function (v, i) { s += '<text x="' + X(i) + '" y="' + (H - 3) + '" font-size="8.5" fill="#7A6A5B" text-anchor="middle">' + PD.esc(v.date.slice(5)) + "</text>"; });
  return s + "</svg>";
};

PD.openVisit = function (famId) {
  PD.state.famId = famId || null;
  var fam = famId ? PD.getFam(famId) : null;
  document.getElementById("visitTitle").textContent = fam ? PD.fmt("visitAgainTitle", { name: fam.motherName || PD.t("familyWord") }) : PD.t("visitNewTitle");
  document.getElementById("mName").value = fam ? (fam.motherName || "") : "";
  document.getElementById("mAge").value = fam && fam.motherAge ? fam.motherAge : "";
  document.getElementById("mHb").value = "";
  document.querySelector('input[name="preg"][value="no"]').checked = true;
  [0, 1, 2].forEach(function (i) { document.getElementById("pal_" + i).checked = false; });
  [0, 1, 2, 3].forEach(function (i) { document.getElementById("sym_" + i).checked = false; });
  [0, 1, 2, 3, 4].forEach(function (i) { document.getElementById("rsk_" + i).checked = false; });
  document.getElementById("childBlocks").innerHTML = "";
  PD.state.blockSeq = 0;
  PD.addChildBlock();
  document.getElementById("formError").textContent = "";
  PD.show("visit");
};
PD.readChildBlock = function (block, fam) {
  var seq = block.getAttribute("data-seq");
  var g = function (id) { return block.querySelector("#" + id + "_" + seq); };
  var existSel = g("exist");
  var existingId = existSel ? existSel.value : "";
  var weightKg = parseFloat(g("wt").value);
  var lenCm = parseFloat(g("len").value);
  var muacRaw = g("muac").value.trim();
  var muacMm = muacRaw === "" ? null : parseFloat(muacRaw);
  var position = (block.querySelector('input[name="pos_' + seq + '"]:checked') || {}).value || "lying";
  var oedema = ((block.querySelector('input[name="oed_' + seq + '"]:checked') || {}).value === "yes");
  if (isNaN(weightKg) || weightKg <= 0 || isNaN(lenCm) || lenCm <= 0) return { error: true };
  var child = null, isNew = false, ageDays = null, sex = null, dobISO = null, approx = false;
  if (existingId && fam) {
    for (var i = 0; i < fam.children.length; i++) if (fam.children[i].id === existingId) child = fam.children[i];
    if (!child) return { error: true };
    sex = child.sex; ageDays = PD.ageDaysOf(child);
  } else {
    isNew = true;
    var sexEl = block.querySelector('input[name="sex_' + seq + '"]:checked');
    if (!sexEl) return { error: true };
    sex = Number(sexEl.value);
    var mode = (block.querySelector('input[name="agemode_' + seq + '"]:checked') || {}).value || "dob";
    if (mode === "dob") {
      var dobVal = g("dob").value;
      if (!dobVal) return { error: true };
      var dob = new Date(dobVal + "T00:00:00"), now = new Date(PD.todayISO() + "T00:00:00");
      ageDays = Math.floor((now - dob) / 86400000);
      if (ageDays < 0) return { error: true };
      dobISO = dobVal;
    } else {
      var mv = parseFloat(g("months").value);
      if (isNaN(mv) || mv < 0) return { error: true };
      ageDays = Math.round(mv * 30.4375);
      var d = new Date(new Date(PD.todayISO() + "T00:00:00").getTime() - ageDays * 86400000);
      dobISO = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      approx = true;
    }
  }
  var a = PD.assessChild({ sex: sex, ageDays: ageDays, weightKg: weightKg, lenCm: lenCm, position: position, muacMm: muacMm, oedema: oedema });
  var visit = {
    date: PD.todayISO(), weightKg: weightKg, lenCm: lenCm, position: position,
    muacMm: muacMm, oedema: oedema, ageDays: ageDays,
    waz: PD.r2(a.waz), haz: PD.r2(a.haz), whz: PD.r2(a.whz),
    acute: a.acute, decidedBy: a.decidedBy, flags: a.flags
  };
  return { error: false, isNew: isNew, childRef: child, sex: sex, dobISO: dobISO, approx: approx, name: isNew ? g("cname").value.trim() : (child ? child.name : ""), visit: visit };
};
PD.submitVisit = function (ev) {
  ev.preventDefault();
  var fams = PD.load();
  var fam = null;
  if (PD.state.famId) { for (var i = 0; i < fams.length; i++) if (fams[i].id === PD.state.famId) fam = fams[i]; }
  var blocks = document.querySelectorAll(".childblock");
  var parsed = [], bad = false;
  blocks.forEach(function (b) { var r = PD.readChildBlock(b, fam); if (r.error) bad = true; else parsed.push(r); });
  if (bad || !parsed.length) { document.getElementById("formError").textContent = PD.t("formErrRequired"); return; }
  document.getElementById("formError").textContent = "";
  if (!fam) {
    fam = { id: PD.uid(), motherName: "", motherAge: null, createdAt: PD.todayISO(), motherChecks: [], children: [] };
    fams.push(fam);
  }
  var mName = document.getElementById("mName").value.trim();
  if (mName) fam.motherName = mName;
  var mAgeVal = document.getElementById("mAge").value.trim();
  var ageYears = mAgeVal === "" ? null : Number(mAgeVal);
  if (ageYears !== null && !isNaN(ageYears)) fam.motherAge = ageYears;
  var preg = (document.querySelector('input[name="preg"]:checked') || {}).value || "no";
  var hbVal = document.getElementById("mHb").value.trim();
  var hb = hbVal === "" ? null : parseFloat(hbVal);
  var chk = {
    date: PD.todayISO(), ageYears: ageYears, pregnant: preg,
    pallor: [0, 1, 2].map(function (j) { return document.getElementById("pal_" + j).checked; }),
    symptoms: [0, 1, 2, 3].map(function (j) { return document.getElementById("sym_" + j).checked; }),
    risks: [0, 1, 2, 3, 4].map(function (j) { return document.getElementById("rsk_" + j).checked; }),
    hb: (hb !== null && !isNaN(hb)) ? hb : null
  };
  var mr = PD.assessMother({ ageYears: chk.ageYears, pregnant: chk.pregnant, pallor: chk.pallor, symptoms: chk.symptoms, risks: chk.risks, hb: chk.hb });
  chk.tier = mr.tier; chk.score = mr.score; chk.hbBand = mr.hbBand;
  fam.motherChecks.push(chk);
  var saved = [];
  parsed.forEach(function (r) {
    var child = r.childRef;
    if (r.isNew || !child) {
      child = { id: PD.uid(), name: r.name || "", sex: r.sex, dobISO: r.dobISO, approx: r.approx, visits: [] };
      fam.children.push(child);
    }
    child.visits.push(r.visit);
    saved.push({ child: child, visit: r.visit });
  });
  if (mr.tier === "high") PD.addReferral(fam, { personKey: "mother", personName: fam.motherName || "", reason: "motherHigh", dest: "PHC", dateReferred: PD.todayISO() });
  PD.store(fams);
  PD.renderResults(fam, saved, chk);
};

PD.markReached = function (famId, refId) {
  var fams = PD.load();
  fams.forEach(function (f) {
    if (f.id !== famId) return;
    f.referrals.forEach(function (r) { if (r.id === refId && r.state === "referred") { r.state = "reached"; r.reachedDate = PD.todayISO(); } });
  });

PD.recordAttempt = function (famId, refId) {
  var sel = document.getElementById("bar_" + famId + "_" + refId);
  var barrier = sel ? sel.value : "other";
  var fams = PD.load();
  fams.forEach(function (f) {
    if (f.id !== famId) return;
    f.referrals.forEach(function (r) {
      if (r.id === refId && r.state === "referred") {
        r.attempts.push({ date: PD.todayISO(), barrier: barrier });

        if (r.attempts.length >= 3) r.state = "closed";

  });

PD.taskDone = function (famId, taskId) {
  var fams = PD.load();
  fams.forEach(function (f) {
    if (f.id !== famId) return;
    f.tasks.forEach(function (tk) { if (tk.id === taskId) tk.done = true; });
  });
  PD.store(fams);
  PD.refreshLists();
};
/* ---------- household cascade & closed referral loop ----------
   Triggered when a child in the just-saved visit is SAM or MAM. The results
   screen's Done button is re-routed here until the cascade is completed or
   explicitly deferred (the deferral is logged with its date). Step 1 screens
   the household's other under-5 children with the same scoring; step 2 asks
   three TB-contact questions; step 3 writes referral records that the worker
   later confirms as reached / not reached (see the referral panel). */
PD.maybeArmCascade = function (fam, savedChildren, motherChk) {
  var triggers = savedChildren.filter(function (pr) { return pr.visit.acute === "SAM" || pr.visit.acute === "MAM"; });
  var btn = document.getElementById("btnDone");
  if (!triggers.length) {
    PD.state.pendingCascade = null;
    btn.textContent = PD.t("doneBtn");
    btn.setAttribute("data-back", "home");
    return;
  }
  PD.state.pendingCascade = {
    famId: fam.id, date: PD.todayISO(), phase: "collect",
    triggers: triggers.map(function (pr) { return { childId: pr.child.id, name: pr.child.name || "", acute: pr.visit.acute }; }),
    motherHigh: !!(motherChk && motherChk.tier === "high"),
    tb: null, sibResults: null, referRows: null
  };
  btn.textContent = PD.t("cascStartBtn");
  btn.removeAttribute("data-back");
};
PD.clearCascade = function () {
  PD.state.pendingCascade = null;
  var btn = document.getElementById("btnDone");
  btn.textContent = PD.t("doneBtn");
  btn.setAttribute("data-back", "home");
};

PD.readSiblings = function () {
  var nRaw = document.getElementById("sibCount").value.trim();
  if (nRaw === "") return { error: "count" };
  var n = parseInt(nRaw, 10);
  if (isNaN(n) || n < 0) return { error: "count" };
  n = Math.min(n, 8);
  var out = [];
  for (var i = 0; i < n; i++) {
    var p = "sib" + i + "_";
    var g = function (id) { return document.getElementById(p + id); };
    var pres = (document.querySelector('input[name="' + p + 'pres"]:checked') || {}).value || "yes";
    var name = g("name").value.trim();
    var monthsRaw = g("months").value.trim();
    var months = monthsRaw === "" ? null : parseFloat(monthsRaw);
    if (pres === "no") { out.push({ present: false, name: name, months: months }); continue; }
    var muacRaw = g("muac").value.trim();
    var muac = muacRaw === "" ? null : parseFloat(muacRaw);
    if (months === null || isNaN(months) || months < 0 || months > 59 || muac === null || isNaN(muac)) return { error: "sib" };
    var sexEl = document.querySelector('input[name="' + p + 'sex"]:checked');
    var sex = sexEl ? Number(sexEl.value) : 1;
    var oedema = ((document.querySelector('input[name="' + p + 'oed"]:checked') || {}).value === "yes");
    var wtRaw = g("wt").value.trim(), lenRaw = g("len").value.trim();
    var wt = wtRaw === "" ? null : parseFloat(wtRaw), len = lenRaw === "" ? null : parseFloat(lenRaw);
    var pos = (document.querySelector('input[name="' + p + 'pos"]:checked') || {}).value || "lying";
    out.push({ present: true, name: name, months: months, sex: sex, muacMm: muac, oedema: oedema, weightKg: (wt !== null && !isNaN(wt) && wt > 0) ? wt : null, lenCm: (len !== null && !isNaN(len) && len > 0) ? len : null, position: pos });
  }
  return { error: null, siblings: out };
};
PD.cascadeContinue = function () {
  var ctx = PD.state.pendingCascade; if (!ctx) return;
  var r = PD.readSiblings();
  var errEl = document.getElementById("cascError");
  if (r.error) { if (errEl) errEl.textContent = PD.t(r.error === "count" ? "cascErrCount" : "cascErrSib"); return; }
  if (errEl) errEl.textContent = "";
  var tb = {};
  [1, 2, 3].forEach(function (q) { var el = document.querySelector('input[name="tbq' + q + '"]:checked'); tb["q" + q] = !!(el && el.value === "yes"); });
  tb.anyYes = tb.q1 || tb.q2 || tb.q3;
  ctx.tb = tb;
  var fams = PD.load();
  var fam = null;
  for (var i = 0; i < fams.length; i++) if (fams[i].id === ctx.famId) fam = fams[i];
  if (!fam) { PD.clearCascade(); PD.renderHome(); PD.show("home"); return; }
  ctx.sibResults = [];
  r.siblings.forEach(function (sb) {
    if (!sb.present) {
      fam.tasks.push({ id: PD.uid(), type: "sibling", name: sb.name || "", date: PD.todayISO(), dueDate: PD.addDays(PD.todayISO(), 7), done: false });
      ctx.sibResults.push({ name: sb.name, absent: true });
      return;
    }
    var ageDays = Math.round(sb.months * 30.4375);
    var d = new Date(new Date(PD.todayISO() + "T00:00:00").getTime() - ageDays * 86400000);
    var dobISO = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    var child = null;
    if (sb.name) { var nm = sb.name.toLowerCase(); for (var j = 0; j < fam.children.length; j++) if ((fam.children[j].name || "").toLowerCase() === nm) child = fam.children[j]; }
    if (!child) { child = { id: PD.uid(), name: sb.name || "", sex: sb.sex, dobISO: dobISO, approx: true, visits: [] }; fam.children.push(child); }
    var visit;
    if (sb.weightKg !== null && sb.lenCm !== null) {
      var a = PD.assessChild({ sex: child.sex, ageDays: ageDays, weightKg: sb.weightKg, lenCm: sb.lenCm, position: sb.position, muacMm: sb.muacMm, oedema: sb.oedema });
      visit = { date: PD.todayISO(), weightKg: sb.weightKg, lenCm: sb.lenCm, position: sb.position, muacMm: sb.muacMm, oedema: sb.oedema, ageDays: ageDays, waz: PD.r2(a.waz), haz: PD.r2(a.haz), whz: PD.r2(a.whz), acute: a.acute, decidedBy: a.decidedBy, flags: a.flags, viaCascade: true };
    } else {
      var c = PD.classifyMuac(sb.months, sb.muacMm, sb.oedema);
      visit = { date: PD.todayISO(), weightKg: null, lenCm: null, position: null, muacMm: sb.muacMm, oedema: sb.oedema, ageDays: ageDays, waz: null, haz: null, whz: null, acute: c.acute, decidedBy: c.decidedBy, flags: [], viaCascade: true };
    }
    child.visits.push(visit);
    ctx.sibResults.push({ name: child.name, childId: child.id, acute: visit.acute, absent: false });
  });
  PD.store(fams);
  ctx.phase = "refer";
  PD.renderCascade();
};
PD.renderCascadeRefer = function (fam, ctx) {
  var rows = [];
  ctx.triggers.forEach(function (tg) { rows.push({ key: "idx_" + tg.childId, personKey: tg.childId, name: tg.name || PD.t("childTitle"), reason: tg.acute, defDest: tg.acute === "SAM" ? "NRC" : "PHC" }); });
  (ctx.sibResults || []).forEach(function (sr) { if (!sr.absent && (sr.acute === "SAM" || sr.acute === "MAM")) rows.push({ key: "sib_" + sr.childId, personKey: sr.childId, name: sr.name || PD.t("childTitle"), reason: sr.acute, defDest: sr.acute === "SAM" ? "NRC" : "PHC" }); });
  if (ctx.tb && ctx.tb.anyYes) rows.push({ key: "tb", personKey: "tb", name: fam.motherName || PD.t("familyWord"), reason: "tb", defDest: "PHC" });
  var motherAlready = false;
  if (ctx.motherHigh) {
    if (PD.findOpenReferral(fam, "mother", "motherHigh")) motherAlready = true;
    else rows.push({ key: "mother", personKey: "mother", name: fam.motherName || PD.t("motherTitle"), reason: "motherHigh", defDest: "PHC" });
  }
  ctx.referRows = rows;
  var h = '<h2 style="font-size:22px">' + PD.esc(PD.t("cascTitle")) + "</h2>";
  h += '<p class="cascline">' + PD.esc(PD.t("lblScreenOnly")) + "</p>";
  if ((ctx.sibResults || []).length) {
    h += '<div class="card"><h3>' + PD.esc(PD.t("step1Title")) + "</h3>";
    ctx.sibResults.forEach(function (sr) {
      if (sr.absent) h += '<p class="sub">' + PD.esc((sr.name || PD.t("childTitle")) + " — " + PD.t("sibAbsent") + ". " + PD.t("sibAbsentNote")) + "</p>";
      else {
        var b = sr.acute === "SAM" ? "b-sam" : (sr.acute === "MAM" ? "b-mam" : "b-ok");
        var tt = sr.acute === "SAM" ? PD.t("samT") : (sr.acute === "MAM" ? PD.t("mamT") : PD.t("normT"));
        h += '<p style="margin:8px 0"><b>' + PD.esc(sr.name || PD.t("childTitle")) + '</b> <span class="badge ' + b + '">' + PD.esc(tt) + "</span></p>";
      }
    });
    h += "</div>";
  }
  h += '<div class="card"><h3>' + PD.esc(PD.t("step3Title")) + "</h3><p class=\"sub\">" + PD.esc(PD.t("step3Intro")) + "</p>";
  rows.forEach(function (row) {
    h += '<div class="field"><label class="flabel">' + PD.esc(PD.fmt("refForLine", { name: row.name, reason: PD.refReasonText(row) })) + '</label>'
      + '<select id="dest_' + row.key + '">'
      + '<option value="NRC"' + (row.defDest === "NRC" ? " selected" : "") + ">" + PD.esc(PD.t("destNRC")) + "</option>"
      + '<option value="PHC"' + (row.defDest === "PHC" ? " selected" : "") + ">" + PD.esc(PD.t("destPHC")) + "</option>"
      + '<option value="other"' + (row.defDest === "other" ? " selected" : "") + ">" + PD.esc(PD.t("destOther")) + "</option></select></div>";
  });
  if (motherAlready) h += '<p class="sub">' + PD.esc((fam.motherName || PD.t("motherTitle")) + " — " + PD.t("refReasonMother") + ": " + PD.t("refAlready")) + "</p>";
  if (ctx.tb && ctx.tb.anyYes) h += '<div class="actionbox amber"><p><b>' + PD.esc(PD.t("tbPromptTitle")) + "</b></p><p>" + PD.esc(PD.t("tbPromptBody")) + "</p><p><b>" + PD.esc(PD.t("tbLabel")) + "</b></p></div>";
  h += '<div class="btnrow"><button type="button" class="btn" id="btnCascFinish">' + PD.esc(PD.t("cascFinishBtn")) + "</button></div></div>";
  h += '<div class="card"><p class="sub">' + PD.esc(PD.t("cascDeferNote")) + '</p><div class="btnrow"><button type="button" class="btn danger" id="btnCascDefer">' + PD.esc(PD.t("cascDeferBtn")) + "</button></div></div>";
  h += '<p class="cascline">' + PD.esc(PD.t("lblRefTrack")) + "</p>";
  document.getElementById("cascadeWrap").innerHTML = h;
  PD.show("cascade");
};
PD.cascadeFinish = function () {
  var ctx = PD.state.pendingCascade; if (!ctx) return;
  var fams = PD.load();
  var fam = null;
  for (var i = 0; i < fams.length; i++) if (fams[i].id === ctx.famId) fam = fams[i];
  if (!fam) { PD.clearCascade(); PD.renderHome(); PD.show("home"); return; }
  (ctx.referRows || []).forEach(function (row) {
    var sel = document.getElementById("dest_" + row.key);
    var dest = sel ? sel.value : row.defDest;
    PD.addReferral(fam, { personKey: row.personKey, personName: row.name, reason: row.reason, dest: dest, dateReferred: PD.todayISO() });
  });
  fam.cascades.push({ date: PD.todayISO(), status: "completed", tb: ctx.tb || null, triggers: ctx.triggers.map(function (t) { return t.childId; }) });
  PD.store(fams);
  PD.clearCascade();
  PD.renderHome();
  PD.show("home");
};
PD.readTbAnswers = function () {
  var tb = {};
  [1, 2, 3].forEach(function (q) { var el = document.querySelector('input[name="tbq' + q + '"]:checked'); tb["q" + q] = !!(el && el.value === "yes"); });
  tb.anyYes = tb.q1 || tb.q2 || tb.q3;
  return tb;
};
PD.cascadeDefer = function () {
  var ctx = PD.state.pendingCascade; if (!ctx) return;
  var fams = PD.load();
  var fam = null;
  for (var i = 0; i < fams.length; i++) if (fams[i].id === ctx.famId) fam = fams[i];
  if (fam) {
    var tb = ctx.tb || (ctx.phase === "collect" ? PD.readTbAnswers() : null);
    fam.cascades.push({ date: PD.todayISO(), status: "deferred", deferDate: PD.todayISO(), tb: tb, triggers: ctx.triggers.map(function (t) { return t.childId; }) });
    PD.store(fams);
  }
  PD.clearCascade();
  PD.renderHome();
  PD.show("home");
};

document.getElementById("langEn").addEventListener("click", function () { PD.lang = "en"; PD.applyI18n(); });
document.getElementById("langHi").addEventListener("click", function () { PD.lang = "hi"; PD.applyI18n(); });
document.getElementById("btnNewVisit").addEventListener("click", function () { PD.openVisit(null); });
document.getElementById("btnAddChild").addEventListener("click", function () { PD.addChildBlock(); });
document.getElementById("visitForm").addEventListener("submit", PD.submitVisit);
document.getElementById("btnFamVisit").addEventListener("click", function () { if (PD.state.famId) PD.openVisit(PD.state.famId); });
document.getElementById("btnFamDelete").addEventListener("click", function () {
  if (!PD.state.famId) return;
  if (window.confirm(PD.t("famDeleteConfirm"))) {
    PD.store(PD.load().filter(function (f) { return f.id !== PD.state.famId; }));
    PD.state.famId = null; PD.renderHome(); PD.show("home");
  }
});
document.addEventListener("click", function (ev) {
  if (ev.target.id === "btnDone" && PD.state.pendingCascade) { PD.renderCascade(); return; }
  if (ev.target.id === "btnCascContinue") { PD.cascadeContinue(); return; }
  if (ev.target.id === "btnCascFinish") { PD.cascadeFinish(); return; }
  if (ev.target.id === "btnCascDefer") { PD.cascadeDefer(); return; }
  var back = ev.target.closest("[data-back]");
  if (back) { PD.renderHome(); PD.show("home"); return; }
  var row = ev.target.closest("[data-fam]");
  if (row) { PD.renderFamily(row.getAttribute("data-fam")); return; }
  var sp = ev.target.closest("[data-speak]");
  if (sp) { PD.speak(sp.getAttribute("data-speak")); return; }
  var rr = ev.target.closest("[data-ref-reached]");
  if (rr) { var rp = rr.getAttribute("data-ref-reached").split("|"); PD.markReached(rp[0], rp[1]); return; }
  var ra = ev.target.closest("[data-ref-attempt]");
  if (ra) { var ap = ra.getAttribute("data-ref-attempt").split("|"); PD.recordAttempt(ap[0], ap[1]); return; }
  var td = ev.target.closest("[data-task-done]");
  if (td) { var tp = td.getAttribute("data-task-done").split("|"); PD.taskDone(tp[0], tp[1]); return; }
  var rm = ev.target.closest(".removechild");
  if (rm) { var blk = rm.closest(".childblock"); if (blk) blk.remove(); PD.refreshRemoveButtons(); return; }
});
document.addEventListener("change", function (ev) {
  var t = ev.target;
  if (t.id === "sibCount") { PD.buildSibBlocks(); return; }
  if (t.name && t.name.indexOf("tbq") === 0) { PD.refreshTbPrompt(); return; }
  if (t.name && /^sib\d+_pres$/.test(t.name)) {
    var sblk = t.closest(".sibblock");
    if (sblk) {
      var absent = t.value === "no";
      var sc = sblk.querySelector(".sibscreen"); if (sc) sc.classList.toggle("hidden", absent);
      var nt = sblk.querySelector(".sibabsentnote"); if (nt) nt.classList.toggle("hidden", !absent);
    }
    return;
  }
  if (t.name && t.name.indexOf("agemode_") === 0) {
    var block = t.closest(".childblock"); if (!block) return;
    var isDob = t.value === "dob";
    block.querySelector(".dobfield").classList.toggle("hidden", !isDob);
    block.querySelector(".monthsfield").classList.toggle("hidden", isDob);
  }
  if (t.id && t.id.indexOf("exist_") === 0) {
    var blk = t.closest(".childblock"); if (!blk) return;
    blk.querySelector(".identnew").classList.toggle("hidden", !!t.value);
  }
});
PD.applyI18n();
PD.renderHome();
PD.show("home");
</script>
</body>
</html>
